version: "3.9"

services:
  # ─── Database (PostgreSQL with pgvector) ──────
  db:
    image: pgvector/pgvector:pg16
    container_name: onebank-db
    environment:
      - POSTGRES_DB=onebank
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - onebank
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d onebank"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis (Broker & Cache) ───────────────────
  redis:
    image: redis:7-alpine
    container_name: onebank-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - onebank

  # ─── Object Storage (MinIO) ───────────────────
  minio:
    image: minio/minio
    container_name: onebank-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - onebank

  # ─── Backend Service ──────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: onebank-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/onebank
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=idbi-onebank-docker-secret-key-2026
      - DEBUG=true
      - CORS_ORIGINS=["http://localhost:3000","http://frontend:3000","http://${VM_IP:-localhost}:3000","http://${VM_IP:-localhost}"]
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - onebank

  # ─── Celery Worker ────────────────────────────
  celery_worker:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: onebank-celery-worker
    command: celery -A app.core.celery_app.celery worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/onebank
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=idbi-onebank-docker-secret-key-2026
      - DEBUG=true
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - ../backend:/app
    depends_on:
      - db
      - redis
    networks:
      - onebank

  # ─── Frontend Service ─────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: onebank-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://${VM_IP:-localhost}:8000
      - VM_IP=${VM_IP:-localhost}
    depends_on:
      - backend
    volumes:
      - ../frontend/src:/app/src
    networks:
      - onebank

volumes:
  db-data:
  redis-data:
  minio-data:

networks:
  onebank:
    driver: bridge
